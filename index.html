<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Language" content="ko">

<title>공유캘린더</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

  @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap");


  /* =========================================================
     기본
     ========================================================= */

  * {
    box-sizing: border-box;
  }

  html {
    width: 100%;
    min-height: 100%;
  }

  body {
    margin: 0;

    font-family:
      "Noto Sans KR",
      "Apple SD Gothic Neo",
      "Malgun Gothic",
      Arial,
      sans-serif;

    background: #f6f7f9;
    color: #222;

    overflow-x: hidden;
  }


  :root {

    --sunday-width: 100px;

    --weekday-width: 255px;

    --column-gap: 4px;

    --calendar-width:
      calc(
        var(--sunday-width) +
        (var(--weekday-width) * 6) +
        (var(--column-gap) * 6)
      );

  }


  /* =========================================================
     상단
     ========================================================= */

  .top {

    background: #f7aeb2;

    padding: 10px 0 8px;

    position: sticky;

    top: 0;

    z-index: 20;

    box-shadow:
      0 1px 4px rgba(0,0,0,.08);

  }


  .top-inner {

    width: var(--calendar-width);

    margin: 0 auto;

    padding: 0;

  }


  .title-row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

  }


  h1 {

    margin: 0;

    font-size: 23px;

    font-weight: 800;

    letter-spacing: -0.7px;

  }


  .month-nav {

    display: flex;

    align-items: center;

    gap: 8px;

    flex-shrink: 0;

  }


  button {

    border: 0;

    border-radius: 8px;

    background: #fff;

    cursor: pointer;

    padding: 9px 13px;

    font-weight: 700;

  }


  button:hover {

    filter: brightness(.97);

  }


  .month-label {

    min-width: 125px;

    text-align: center;

    font-size: 19px;

    font-weight: 800;

  }


  /* =========================================================
     안내
     ========================================================= */

  .setup {

    width: var(--calendar-width);

    margin: 10px auto 0;

    padding: 10px 12px;

    background: #fff;

    border: 1px solid #F7AEB2;

    font-size: 14px;

    line-height: 1.45;

  }


  .setup strong {

    color: #a05d00;

  }


  /* =========================================================
     캘린더
     ========================================================= */

  .calendar-wrap {

    width: 100%;

    overflow-x: auto;

    overflow-y: visible;

    padding: 6px 0 10px;

    scrollbar-gutter: stable;

  }


  .calendar {

    width: var(--calendar-width);

    min-width: var(--calendar-width);

    margin: 0 auto;

    display: grid;

    grid-template-columns:
      var(--sunday-width)
      repeat(6, var(--weekday-width));

    gap: var(--column-gap);

  }


  /* =========================================================
     날짜 칸
     ========================================================= */

  .day {

    min-height: 175px;

    background: #fff;

    border: 1px solid #bfc3c8;

    position: relative;

    display: flex;

    flex-direction: column;

    transition: .12s;

    min-width: 0;

  }


  .day.blank {

    background: #f0f1f2;

  }


  .day.sunday {

    background: #EFEFEF;

  }


  .day.outside-month {

    background: #EFEFEF;

    opacity: .92;

  }


  /* =========================================================
     날짜 헤더
     ========================================================= */

  .day-header {

    height: 29px;

    min-height: 29px;

    flex: 0 0 29px;

    padding: 3px 7px;

    display: flex;

    justify-content: flex-end;

    align-items: center;

    border-bottom: 1px solid #c8c8c8;

    background: #fff4f4;

  }


  .date {

    font-weight: 800;

    font-size: 15px;

    white-space: nowrap;

    text-align: right;

    background: #fff4f4;

  }


  .day.sunday .day-header,
  .day.sunday .date {

    background: #EFEFEF;

  }


  .day.outside-month .day-header,
  .day.outside-month .date {

    background: #EFEFEF;

  }


  /* =========================================================
     휴무 / 단축근무
     ========================================================= */

  .status-badge {

    font-size: 15px;

    font-weight: 800;

    padding: 0;

    margin-right: auto;

    border-radius: 0;

    background: transparent;

    line-height: 1;

  }


  .status-badge.off {

    background: transparent;

    color: #333;

  }


  .status-badge.short {

    background: transparent;

    color: #9a7200;

  }


  /* =========================================================
     날짜 내부 행
     ========================================================= */

  .rows {

    flex: 1;

    display: flex;

    flex-direction: column;

    min-height: 0;

  }


  .part-row {

    flex: 1 1 0;

    min-height: 0;

    height: 36px;

    border-bottom: 1px solid #ddd;

    display: flex;

    align-items: stretch;

  }


  /* =========================================================
     담당자 이름
     ========================================================= */

  .part-name {

    width: 42px;

    flex: 0 0 42px;

    padding: 1px 2px;

    font-weight: 800;

    font-size: 11px;

    border-right: 1px solid #e0e0e0;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    line-height: 1.1;

    overflow: hidden;

    white-space: normal;

    word-break: keep-all;

  }


  .day.sunday .part-name {

    width: 42px;

    flex-basis: 40px;

    font-size: 11px;

    background: #EFEFEF;

  }


  .day.outside-month .part-name {

    background: #EFEFEF;

  }


  /* =========================================================
     메모 입력 영역
     ========================================================= */

  .memo {

    width: 100%;

    min-width: 0;

    min-height: 0;

    height: 36px;

    border: 0;

    outline: 0;

    background: transparent;

    padding: 0 4px;

    margin: 0;

    font-size: 12px;

    line-height: 16px;

    font-family: inherit;

    white-space: pre-wrap;

    overflow: hidden;

    overflow-wrap: anywhere;

    word-break: break-word;

    cursor: text;

    display: block;

    text-align: left;

    vertical-align: top;

    ime-mode: active;

    contain: layout style;

  }


  /*
    중요:
    contenteditable 내부에서 Enter를 누르면
    브라우저에 따라 div / p가 만들어질 수 있음.

    div / p 기본 margin을 제거해서
    재접속 후 두 번째 줄이 아래로 밀리는 문제 방지
  */

  .memo > div,
  .memo > p,
  .memo > blockquote {

    margin: 0 !important;

    padding: 0 !important;

    border: 0;

    line-height: 15px !important;

    font-size: inherit;

    font-family: inherit;

  }


  /*
    inline 요소는 기존 색상 기능을 유지
  */

  .memo > span,
  .memo > font,
  .memo > b,
  .memo > strong,
  .memo > i,
  .memo > em {

    display: inline;

  }


  /*
    한 줄
    기존처럼 위쪽 여백을 줌
  */

  .memo.one-line {

    padding-top: 10px;

    padding-bottom: 0;

    line-height: 16px;

  }


  /*
    두 줄
    ★ 핵심 수정 부분 ★

    상하 여백 없음
    두 줄을 셀 위쪽에서 바로 표시
  */

  .memo.two-lines {

    padding-top: 0 !important;

    padding-bottom: 0 !important;

    line-height: 15px !important;

  }


  .memo.two-lines > div,
  .memo.two-lines > p,
  .memo.two-lines > blockquote {

    margin-top: 0 !important;

    margin-bottom: 0 !important;

    padding-top: 0 !important;

    padding-bottom: 0 !important;

    line-height: 15px !important;

  }


  .memo:focus {

    background:
      rgba(255,255,255,.55);

  }


  .memo:empty:before {

    content: attr(data-placeholder);

    color: #aaa;

  }


  .memo br {

    line-height: 1;

  }


  /* =========================================================
     선택 색상 툴바
     ========================================================= */

  .selection-toolbar {

    position: fixed;

    display: none;

    z-index: 100;

    background: #fff;

    border: 1px solid #bbb;

    border-radius: 8px;

    box-shadow:
      0 5px 18px rgba(0,0,0,.2);

    padding: 4px;

    gap: 3px;

  }


  .selection-toolbar.show {

    display: flex;

  }


  .selection-toolbar button {

    width: 26px;

    height: 26px;

    padding: 0;

    border: 1px solid #ddd;

    background: #fff;

    border-radius: 5px;

    font-size: 18px;

    line-height: 20px;

  }


  .selection-toolbar button:first-child {

    color: #222;

  }


  .selection-toolbar button.red {

    color: #d62828;

  }


  .selection-toolbar button.blue {

    color: #2468d8;

  }


  /* =========================================================
     기타
     ========================================================= */

  .empty {

    visibility: hidden;

  }


  .line-limit-notice {

    position: fixed;

    top: 72px;

    left: 50%;

    transform:
      translateX(-50%)
      translateY(-8px);

    z-index: 80;

    display: none;

    padding: 8px 15px;

    border: 1px solid #f0c36d;

    border-radius: 999px;

    background: #fff8e8;

    color: #8a5a00;

    font-size: 12px;

    font-weight: 700;

    box-shadow:
      0 4px 16px rgba(0,0,0,.12);

    pointer-events: none;

  }


  .line-limit-notice.show {

    display: block;

  }


  /* =========================================================
     설정 팝업
     ========================================================= */

  .toolbar {

    position: fixed;

    left: 50%;

    top: 50%;

    transform:
      translate(-50%,-50%);

    width: 330px;

    max-width:
      calc(100vw - 36px);

    background: #fff;

    border: 1px solid #ccc;

    border-radius: 14px;

    box-shadow:
      0 8px 28px rgba(0,0,0,.18);

    padding: 14px;

    z-index: 50;

    display: none;

  }


  .toolbar.show {

    display: block;

  }


  .toolbar h3 {

    margin: 0 0 10px;

  }


  .toolbar-grid {

    display: grid;

    grid-template-columns:
      repeat(3,1fr);

    gap: 6px;

  }


  .toolbar button {

    border: 1px solid #ddd;

    padding: 7px 4px;

    font-size: 12px;

  }


  .toolbar-grid button[data-status="off"] {

    background: #d9d9d9;

  }


  .toolbar-grid button[data-status="short"] {

    background: #FFE8B1;

  }


  .toolbar-status-tip {

    margin-top: 9px;

    font-size: 11px;

    color: #777;

    text-align: center;

  }


  .selected-outline {

    outline:
      3px solid #F7AEB2;

    outline-offset: -3px;

  }


  .save-state {

    position: fixed;

    left: 18px;

    bottom: 18px;

    background: #222;

    color: #F7AEB2;

    padding: 8px 12px;

    border-radius: 99px;

    font-size: 12px;

    z-index: 60;

  }


  /* =========================================================
     하단 서명
     ========================================================= */

  .signature {

    width: var(--calendar-width);

    margin: 0 auto;

    text-align: center;

    color: #999;

    font-size: 10px;

    letter-spacing: .4px;

    padding: 8px 0 12px;

    user-select: none;

  }


  /* =========================================================
     모바일
     ========================================================= */

  @media (max-width: 900px) {

    .calendar-wrap {

      padding:
        6px 18px 10px;

    }

  }


  /* =========================================================
     인쇄
     ========================================================= */

  @media print {

    @page {

      size: A4 landscape;

      margin: 3mm;

    }


    html,
    body {

      width: 100%;

      height: 100%;

      margin: 0;

      padding: 0;

      background: #fff;

      overflow: visible;

      -webkit-print-color-adjust: exact;

      print-color-adjust: exact;

    }


    .top {

      position: static;

      width: 100%;

      padding:
        1mm 0 .5mm;

      box-shadow: none;

      overflow: visible;

    }


    .top-inner {

      width: 100%;

    }


    h1 {

      font-size: 14pt;

    }


    .month-nav {

      display: none;

    }


    .setup {

      width: 100%;

      margin: 1mm 0;

      padding: 1mm;

      font-size: 6pt;

    }


    .calendar-wrap {

      width: 100%;

      padding: .7mm 0 0;

      overflow: visible;

    }


    .calendar {

      width: 100%;

      min-width: 0;

      margin: 0;

      height: 174mm;

      display: grid;

      grid-template-columns:
        repeat(6, minmax(0, 1fr));

      grid-auto-rows: 1fr;

      gap: .4mm;

    }


    .day.sunday {

      display: none !important;

    }


    .day {

      min-height: 0;

      height: 100%;

      width: 100%;

      border: .25mm solid #777;

      break-inside: avoid;

    }


    .day-header {

      height: 5mm;

      flex: 0 0 5mm;

      padding: .4mm 1mm;

    }


    .date {

      font-size: 7pt;

      margin-left: auto;

      text-align: right;

    }


    .status-badge {

      font-size: 7pt;

      padding: 0;

      font-weight: 800;

    }


    .part-row {

      min-height: 0;

      height: 6.8mm;

      display: flex;

      align-items: stretch;

    }


    .part-name {

      width: 7mm;

      flex: 0 0 7mm;

      padding: .2mm;

      font-size: 5.8pt !important;

      line-height: 1.05 !important;

      align-items: center;

      justify-content: center;

      text-align: center;

      overflow: hidden;

      white-space: normal;

      word-break: keep-all;

    }


    .day.outside-month .part-name {

      font-size: 5.8pt !important;

      line-height: 1.05 !important;

    }


    .memo {

      min-height: 0;

      height: 6.8mm;

      padding:
        0 .6mm;

      font-size: 6.3pt;

      line-height: 3.0mm;

      display: block;

      text-align: left;

      overflow: hidden;

    }


    /*
      인쇄 시 내부 div/p도
      기본 여백 제거
    */

    .memo > div,
    .memo > p,
    .memo > blockquote {

      margin: 0 !important;

      padding: 0 !important;

      line-height: 3.0mm !important;

    }


    /*
      인쇄 한 줄
    */

    .memo.one-line {

      padding-top: 1.7mm;

      padding-bottom: 0;

      line-height: 3.0mm;

    }


    /*
      인쇄 두 줄
      상하 여백 없음
    */

    .memo.two-lines {

      padding-top: 0 !important;

      padding-bottom: 0 !important;

      line-height: 3.0mm !important;

    }


    .memo.two-lines > div,
    .memo.two-lines > p,
    .memo.two-lines > blockquote {

      margin-top: 0 !important;

      margin-bottom: 0 !important;

      padding-top: 0 !important;

      padding-bottom: 0 !important;

      line-height: 3.0mm !important;

    }


    .toolbar,
    .selection-toolbar,
    .save-state,
    .line-limit-notice {

      display: none !important;

    }


    .signature {

      width: 100%;

      font-size: 5.5pt;

      padding: .8mm 0 0;

    }

  }

</style>
</head>


<body>


<!-- =========================================================
     상단
     ========================================================= -->

<header class="top">

  <div class="top-inner">

    <div class="title-row">

      <h1>
        실장/코디/간호/피부 공유캘린더
      </h1>


      <div class="month-nav">

        <button id="prevBtn">
          ‹
        </button>


        <div
          class="month-label"
          id="monthLabel">
        </div>


        <button id="nextBtn">
          ›
        </button>


        <button id="todayBtn">
          오늘
        </button>


        <button
          id="printBtn"
          type="button">

          인쇄

        </button>

      </div>

    </div>

  </div>

</header>


<!-- =========================================================
     줄 제한 알림
     ========================================================= -->

<div
  class="line-limit-notice"
  id="lineLimitNotice">

  텍스트는 최대 2줄까지만 입력할 수 있어요

</div>


<!-- =========================================================
     사용 안내
     ========================================================= -->

<div
  class="setup"
  id="setupNotice">

  1. 텍스트 입력 후 색상을 바꿀 부분을 드래그하면 글자색을 바꿀 수 있어요.<br>

  2. 날짜 부분을 세 번 클릭하면 휴무/단축근무를 설정할 수 있어요.

</div>


<!-- =========================================================
     캘린더
     ========================================================= -->

<div class="calendar-wrap">

  <div
    class="calendar"
    id="calendar">
  </div>

</div>


<!-- =========================================================
     하단
     ========================================================= -->

<div class="signature">

  © 2026. Designed & Developed by EUNBIN GA

</div>


<!-- =========================================================
     날짜 설정 팝업
     ========================================================= -->

<div
  class="toolbar"
  id="toolbar">

  <h3 id="toolbarTitle">
    날짜 설정
  </h3>


  <div class="toolbar-grid">

    <button data-status="normal">
      정상
    </button>

    <button data-status="off">
      휴무
    </button>

    <button data-status="short">
      단축근무
    </button>

  </div>


  <div class="toolbar-status-tip">

    휴무 = 회색 · 단축근무 = 연노랑

  </div>


  <button
    id="closeToolbar"
    style="width:100%;margin-top:10px;">

    닫기

  </button>

</div>


<!-- =========================================================
     글자색 선택
     ========================================================= -->

<div
  class="selection-toolbar"
  id="selectionToolbar">

  <button
    type="button"
    data-text-color="#222222"
    title="진한 차콜">

    ●

  </button>


  <button
    type="button"
    data-text-color="#d62828"
    title="빨간색"
    class="red">

    ●

  </button>


  <button
    type="button"
    data-text-color="#2468d8"
    title="파란색"
    class="blue">

    ●

  </button>

</div>


<!-- =========================================================
     저장 상태
     ========================================================= -->

<div
  class="save-state"
  id="saveState">

  저장 준비 중…

</div>


<script>


/* =========================================================
   1. Supabase 설정
   ========================================================= */

const SUPABASE_URL =
  "https://gysriyggwkdjriokttpt.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_a1qvwo_vSi0ftx1SVY_Ing_H8eIstT3";


const supabaseReady =
  !SUPABASE_URL.includes("YOUR-PROJECT") &&
  !SUPABASE_PUBLISHABLE_KEY.includes(
    "YOUR-PUBLISHABLE-KEY"
  );


const db =
  supabaseReady
    ? window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      )
    : null;


/* =========================================================
   2. 기본 설정
   ========================================================= */

const PARTS = [
  "실장",
  "코디",
  "피부",
  "간호"
];


const DEFAULT_SUNDAY = [
  "마감",
  "수건",
  "탕비실",
  "인스타"
];


const SUNDAY_ROTATION_START =
  new Date(2026, 7, 2);


/* =========================================================
   일요일 담당 자동 계산
   ========================================================= */

function getSundayDefaults(dateStr) {

  const d =
    new Date(
      dateStr + "T00:00:00"
    );


  const diffDays =
    Math.floor(
      (
        d -
        SUNDAY_ROTATION_START
      ) /
      86400000
    );


  const weekIndex =
    Math.floor(
      diffDays / 7
    );


  const pantry =
    ["간호", "코디", "피부"][
      (
        (weekIndex % 3) +
        3
      ) % 3
    ];


  const towel =
    ["피부", "코디"][
      (
        (weekIndex % 2) +
        2
      ) % 2
    ];


  const instagram =
    ["피부", "코디", "간호"][
      (
        (weekIndex % 3) +
        3
      ) % 3
    ];


  return [
    "",
    towel,
    pantry,
    instagram
  ];

}


/* =========================================================
   전역 변수
   ========================================================= */

let viewDate =
  new Date();


viewDate.setDate(1);


let entries = {};


let selectedDate = null;


let savingTimer = null;


const $ =
  id =>
    document.getElementById(id);


/* =========================================================
   Entry Key
   ========================================================= */

function keyFor(
  dateStr,
  part
) {

  return `${dateStr}__${part}`;

}


/* =========================================================
   날짜 → ISO
   ========================================================= */

function dateToISO(date) {

  return [

    date.getFullYear(),

    String(
      date.getMonth() + 1
    ).padStart(2, "0"),

    String(
      date.getDate()
    ).padStart(2, "0")

  ].join("-");

}


/* =========================================================
   요일
   ========================================================= */

function getKoreanDay(date) {

  const days = [
    "일",
    "월",
    "화",
    "수",
    "목",
    "금",
    "토"
  ];

  return days[
    date.getDay()
  ];

}


/* =========================================================
   저장 상태
   ========================================================= */

function setSaveState(text) {

  $("saveState").textContent =
    text;

}


/* =========================================================
   한글 입력 준비
   ========================================================= */

function prepareKoreanInput(editor) {

  editor.setAttribute(
    "lang",
    "ko"
  );


  editor.setAttribute(
    "inputmode",
    "text"
  );


  editor.setAttribute(
    "autocapitalize",
    "off"
  );


  editor.setAttribute(
    "autocomplete",
    "off"
  );


  editor.setAttribute(
    "spellcheck",
    "false"
  );

}


/* =========================================================
   저장된 메모 HTML 정리
   =========================================================

   핵심 수정 부분.

   contenteditable은 브라우저에 따라 Enter 입력 시

   <div>첫째 줄</div>
   <div>둘째 줄</div>

   또는

   <p>첫째 줄</p>
   <p>둘째 줄</p>

   형태로 저장될 수 있습니다.

   이때 div / p의 기본 margin 때문에
   재접속 후 두 번째 줄이 아래로 밀립니다.

   따라서 불러오거나 저장하기 전에
   block 요소의 margin / padding을 제거합니다.
   ========================================================= */

function normalizeMemoHTML(html) {

  if (!html) {

    return "";

  }


  const temp =
    document.createElement(
      "div"
    );


  temp.innerHTML =
    html;


  /*
    block 요소 기본 여백 제거
  */

  temp.querySelectorAll(
    "div, p, blockquote"
  ).forEach(
    el => {

      el.style.marginTop =
        "0";

      el.style.marginRight =
        "0";

      el.style.marginBottom =
        "0";

      el.style.marginLeft =
        "0";

      el.style.paddingTop =
        "0";

      el.style.paddingRight =
        "0";

      el.style.paddingBottom =
        "0";

      el.style.paddingLeft =
        "0";

      el.style.lineHeight =
        "15px";

    }
  );


  return temp.innerHTML;

}


/* =========================================================
   월 불러오기
   ========================================================= */

async function loadMonth() {

  entries = {};


  const year =
    viewDate.getFullYear();


  const month =
    viewDate.getMonth() + 1;


  const firstDay =
    new Date(
      year,
      month - 1,
      1
    ).getDay();


  const days =
    new Date(
      year,
      month,
      0
    ).getDate();


  const totalSoFar =
    firstDay + days;


  const remaining =
    (
      7 -
      (
        totalSoFar % 7
      )
    ) % 7;


  const gridStartDate =
    new Date(
      year,
      month - 1,
      1 - firstDay
    );


  const gridEndDate =
    new Date(
      year,
      month - 1,
      days + remaining
    );


  const from =
    dateToISO(
      gridStartDate
    );


  const to =
    dateToISO(
      gridEndDate
    );


  if (!db) {

    setSaveState(
      "미연결 데모 모드"
    );

    render();

    return;

  }


  setSaveState(
    "불러오는 중…"
  );


  const {
    data,
    error
  } =
    await db
      .from(
        "calendar_entries"
      )
      .select("*")
      .gte(
        "work_date",
        from
      )
      .lte(
        "work_date",
        to
      );


  if (error) {

    console.error(error);

    setSaveState(
      "DB 불러오기 오류"
    );

    render();

    return;

  }


  for (
    const row of
    data || []
  ) {

    entries[
      keyFor(
        row.work_date,
        row.part
      )
    ] = {

      /*
        DB에서 불러오는 순간에도
        저장된 HTML을 정리
      */

      memo:
        normalizeMemoHTML(
          row.memo || ""
        ),

      bg:
        row.bg_color || "",

      text:
        row.text_color || "",

      status:
        row.status ||
        "normal"

    };

  }


  setSaveState(
    "자동 저장됨"
  );


  render();

}


/* =========================================================
   저장
   ========================================================= */

function queueSave(
  dateStr,
  part
) {

  setSaveState(
    "저장 중…"
  );


  clearTimeout(
    savingTimer
  );


  savingTimer =
    setTimeout(
      async () => {

        if (!db) {

          setSaveState(
            "미연결 데모 모드"
          );

          return;

        }


        const entry =
          entries[
            keyFor(
              dateStr,
              part
            )
          ];


        if (!entry) {

          return;

        }


        /*
          저장 직전 HTML 정리
        */

        const normalizedMemo =
          normalizeMemoHTML(
            entry.memo || ""
          );


        /*
          메모 자체도 정리된 값으로
          다시 유지
        */

        entry.memo =
          normalizedMemo;


        const {
          error
        } =
          await db
            .from(
              "calendar_entries"
            )
            .upsert({

              work_date:
                dateStr,

              part:
                part,

              memo:
                normalizedMemo,

              bg_color:
                entry.bg,

              text_color:
                entry.text,

              status:
                entry.status

            }, {

              onConflict:
                "work_date,part"

            });


        if (error) {

          console.error(error);

          setSaveState(
            "저장 실패"
          );

        } else {

          setSaveState(
            "자동 저장됨"
          );

        }

      },
      500
    );

}


/* =========================================================
   Entry 가져오기
   ========================================================= */

function getEntry(
  dateStr,
  part,
  isSunday
) {

  const key =
    keyFor(
      dateStr,
      part
    );


  if (!entries[key]) {

    const sundayDefaults =
      isSunday
        ? getSundayDefaults(
            dateStr
          )
        : [
            "",
            "",
            "",
            ""
          ];


    entries[key] = {

      memo:
        isSunday
          ? sundayDefaults[
              PARTS.indexOf(part)
            ]
          : "",

      bg: "",

      text: "",

      status:
        "normal"

    };

  }


  return entries[key];

}


/* =========================================================
   날짜 배경
   ========================================================= */

function getDayStyle(
  dateStr
) {

  const first =
    getEntry(
      dateStr,
      "실장",
      false
    );


  let bg = "";


  if (
    first.status === "off"
  ) {

    bg =
      "#d9d9d9";

  }


  if (
    first.status === "short"
  ) {

    bg =
      "#FEFFE8";

  }


  return {
    bg
  };

}


/* =========================================================
   날짜 상태
   ========================================================= */

function dayStatus(
  dateStr
) {

  const first =
    getEntry(
      dateStr,
      "실장",
      false
    );


  return (
    first.status ||
    "normal"
  );

}


/* =========================================================
   메모 줄 수 계산
   ========================================================= */

function getMemoLineCount(
  editor
) {

  const text =
    editor.innerText
      .replace(/\r/g, "");


  let lines =
    text.split("\n");


  /*
    contenteditable에서 마지막에
    빈 줄이 자동으로 붙는 경우 제거
  */

  while (
    lines.length > 1 &&
    lines[
      lines.length - 1
    ] === ""
  ) {

    lines.pop();

  }


  return Math.max(
    1,
    lines.length
  );

}


/* =========================================================
   실제 영역 overflow 확인
   ========================================================= */

function isMemoOverflowing(
  editor
) {

  return (
    editor.scrollHeight -
    editor.clientHeight
  ) > 2;

}


/* =========================================================
   메모 줄 클래스
   ========================================================= */

function updateMemoLineClass(
  editor
) {

  const count =
    getMemoLineCount(
      editor
    );


  editor.classList.remove(
    "one-line",
    "two-lines"
  );


  if (
    count >= 2
  ) {

    /*
      두 줄
    */

    editor.classList.add(
      "two-lines"
    );

  } else {

    /*
      한 줄
    */

    editor.classList.add(
      "one-line"
    );

  }

}


/* =========================================================
   마지막 정상 메모 복구
   ========================================================= */

function restoreLastValidMemo(
  memo
) {

  memo.innerHTML =
    memo.dataset.lastValidHtml ||
    "";


  const range =
    document.createRange();


  range.selectNodeContents(
    memo
  );


  range.collapse(false);


  const sel =
    window.getSelection();


  sel.removeAllRanges();


  sel.addRange(range);

}


/* =========================================================
   줄 제한 알림
   ========================================================= */

function showLineLimitNotice() {

  const notice =
    $("lineLimitNotice");


  notice.classList.add(
    "show"
  );


  clearTimeout(
    window.__lineLimitNoticeTimer
  );


  window.__lineLimitNoticeTimer =
    setTimeout(
      () => {

        notice.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* =========================================================
   날짜 칸 생성
   ========================================================= */

function createDayBox(
  d,
  isOutsideMonth = false
) {

  const dateStr =
    dateToISO(d);


  const sunday =
    d.getDay() === 0;


  const dayBox =
    document.createElement(
      "div"
    );


  dayBox.className =
    "day" +
    (
      sunday
        ? " sunday"
        : ""
    );


  if (
    isOutsideMonth
  ) {

    dayBox.classList.add(
      "outside-month"
    );

  }


  dayBox.dataset.date =
    dateStr;


  /* =======================================================
     날짜 배경
     ======================================================= */

  if (
    sunday ||
    isOutsideMonth
  ) {

    dayBox.style.background =
      "#EFEFEF";

  } else {

    const style =
      getDayStyle(
        dateStr
      );


    if (style.bg) {

      dayBox.style.background =
        style.bg;

    }

  }


  /* =======================================================
     날짜 헤더
     ======================================================= */

  const header =
    document.createElement(
      "div"
    );


  header.className =
    "day-header";


  const dateEl =
    document.createElement(
      "span"
    );


  dateEl.className =
    "date";


  dateEl.textContent =
    `${d.getMonth() + 1}/${d.getDate()}(${getKoreanDay(d)})`;


  const badge =
    document.createElement(
      "span"
    );


  badge.className =
    "status-badge";


  const status =
    dayStatus(
      dateStr
    );


  if (
    status === "off"
  ) {

    badge.textContent =
      "휴무";

    badge.classList.add(
      "off"
    );

  } else if (
    status === "short"
  ) {

    badge.textContent =
      "단축근무";

    badge.classList.add(
      "short"
    );

  } else {

    badge.textContent =
      "";

    badge.style.display =
      "none";

  }


  header.append(
    badge,
    dateEl
  );


  dayBox.appendChild(
    header
  );


  /* =======================================================
     담당자 행
     ======================================================= */

  const rows =
    document.createElement(
      "div"
    );


  rows.className =
    "rows";


  PARTS.forEach(
    (part, idx) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "part-row";


      row.dataset.part =
        part;


      const partName =
        document.createElement(
          "div"
        );


      partName.className =
        "part-name";


      partName.textContent =
        sunday
          ? DEFAULT_SUNDAY[idx]
          : part;


      /* =====================================================
         메모
         ===================================================== */

      const memo =
        document.createElement(
          "div"
        );


      memo.className =
        "memo";


      memo.contentEditable =
        "true";


      memo.spellcheck =
        false;


      prepareKoreanInput(
        memo
      );


      const entry =
        getEntry(
          dateStr,
          part,
          sunday
        );


      const sundayDefault =
        sunday
          ? getSundayDefaults(
              dateStr
            )[idx]
          : "";


      /*
        DB에서 가져온 HTML을
        화면에 넣기 전에 정리
      */

      const savedMemo =
        (
          sunday &&
          !entry.memo
        )
          ? sundayDefault
          : entry.memo;


      memo.innerHTML =
        normalizeMemoHTML(
          savedMemo
        );


      memo.dataset.placeholder =
        sunday
          ? ""
          : " ";


      /*
        한 줄 / 두 줄 판정
      */

      updateMemoLineClass(
        memo
      );


      /*
        정리된 HTML을
        마지막 정상값으로 저장
      */

      memo.dataset.lastValidHtml =
        normalizeMemoHTML(
          memo.innerHTML
        );


      /* =====================================================
         입력 이벤트
         ===================================================== */

      memo.addEventListener(
        "keydown",
        (e) => {

          if (
            e.key !== "Enter"
          ) {

            return;

          }


          /*
            이미 2줄이면
            엔터 추가 금지
          */

          if (
            getMemoLineCount(
              memo
            ) >= 2
          ) {

            e.preventDefault();

            showLineLimitNotice();

          }

        }
      );


      /* =====================================================
         입력
         ===================================================== */

      memo.addEventListener(
        "input",
        () => {

          const lineCount =
            getMemoLineCount(
              memo
            );


          updateMemoLineClass(
            memo
          );


          /*
            2줄 초과 또는 실제 영역 초과
          */

          if (
            lineCount > 2 ||
            isMemoOverflowing(
              memo
            )
          ) {

            restoreLastValidMemo(
              memo
            );


            updateMemoLineClass(
              memo
            );


            showLineLimitNotice();

            return;

          }


          /*
            정상 입력
          */

          const normalizedHTML =
            normalizeMemoHTML(
              memo.innerHTML
            );


          /*
            화면도 정리된 HTML로 유지
          */

          if (
            memo.innerHTML !==
            normalizedHTML
          ) {

            memo.innerHTML =
              normalizedHTML;

          }


          memo.dataset.lastValidHtml =
            normalizedHTML;


          getEntry(
            dateStr,
            part,
            sunday
          ).memo =
            normalizedHTML;


          queueSave(
            dateStr,
            part
          );

        }
      );


      /* =====================================================
         붙여넣기
         ===================================================== */

      memo.addEventListener(
        "paste",
        (e) => {

          e.preventDefault();


          const text =
            (
              e.clipboardData ||
              window.clipboardData
            )
              .getData("text");


          const incomingLines =
            text
              .replace(/\r/g, "")
              .split("\n");


          const currentLines =
            getMemoLineCount(
              memo
            );


          /*
            현재 커서 위치를 고려하여
            최대 2줄
          */

          if (
            currentLines >= 2
          ) {

            showLineLimitNotice();

            return;

          }


          const allowed =
            Math.max(
              1,
              2 -
              currentLines +
              1
            );


          const textToInsert =
            incomingLines
              .slice(
                0,
                allowed
              )
              .join("\n");


          if (
            incomingLines.length >
            allowed
          ) {

            showLineLimitNotice();

          }


          document.execCommand(
            "insertText",
            false,
            textToInsert
          );

        }
      );


      /* =====================================================
         색상 툴바
         ===================================================== */

      memo.addEventListener(
        "mouseup",
        () => {

          showSelectionToolbar(
            memo
          );

        }
      );


      memo.addEventListener(
        "keyup",
        () => {

          showSelectionToolbar(
            memo
          );

        }
      );


      row.append(
        partName,
        memo
      );


      rows.appendChild(
        row
      );

    }
  );


  dayBox.appendChild(
    rows
  );


  /* =======================================================
     날짜 선택
     ======================================================= */

  dayBox.addEventListener(
    "click",
    (e) => {

      if (
        e.target.closest(
          ".memo"
        )
      ) {

        return;

      }


      selectDay(
        dayBox
      );


      if (
        e.detail === 3
      ) {

        openToolbar(
          dateStr
        );

      }

    }
  );


  return dayBox;

}


/* =========================================================
   캘린더 렌더링
   ========================================================= */

function render() {

  const year =
    viewDate.getFullYear();


  const month =
    viewDate.getMonth() + 1;


  $("monthLabel").textContent =
    `${year}년 ${month}월`;


  const calendar =
    $("calendar");


  calendar.innerHTML =
    "";


  const firstDay =
    new Date(
      year,
      month - 1,
      1
    ).getDay();


  const days =
    new Date(
      year,
      month,
      0
    ).getDate();


  /* =======================================================
     전월
     ======================================================= */

  const prevMonthLastDate =
    new Date(
      year,
      month - 1,
      0
    ).getDate();


  for (
    let i = firstDay - 1;
    i >= 0;
    i--
  ) {

    const d =
      new Date(
        year,
        month - 2,
        prevMonthLastDate - i
      );


    calendar.appendChild(
      createDayBox(
        d,
        true
      )
    );

  }


  /* =======================================================
     현재 월
     ======================================================= */

  for (
    let i = 1;
    i <= days;
    i++
  ) {

    const d =
      new Date(
        year,
        month - 1,
        i
      );


    calendar.appendChild(
      createDayBox(
        d,
        false
      )
    );

  }


  /* =======================================================
     다음 월
     ======================================================= */

  const totalCells =
    calendar.children.length;


  const remaining =
    (
      7 -
      (
        totalCells % 7
      )
    ) % 7;


  for (
    let i = 1;
    i <= remaining;
    i++
  ) {

    const d =
      new Date(
        year,
        month,
        i
      );


    calendar.appendChild(
      createDayBox(
        d,
        true
      )
    );

  }

}


/* =========================================================
   선택 영역 색상 툴바
   ========================================================= */

function showSelectionToolbar(
  memoEl
) {

  const sel =
    window.getSelection();


  if (
    !sel ||
    sel.isCollapsed
  ) {

    $("selectionToolbar")
      .classList
      .remove("show");

    return;

  }


  const range =
    sel.getRangeAt(0);


  if (
    !memoEl.contains(
      range.commonAncestorContainer
    )
  ) {

    $("selectionToolbar")
      .classList
      .remove("show");

    return;

  }


  const rect =
    range.getBoundingClientRect();


  const toolbar =
    $("selectionToolbar");


  toolbar.style.top =
    `${rect.top - 36}px`;


  toolbar.style.left =
    `${rect.left}px`;


  toolbar.classList.add(
    "show"
  );

}


/* =========================================================
   선택 영역 변경
   ========================================================= */

document.addEventListener(
  "selectionchange",
  () => {

    const sel =
      window.getSelection();


    if (
      !sel ||
      sel.isCollapsed
    ) {

      $("selectionToolbar")
        .classList
        .remove("show");

    }

  }
);


/* =========================================================
   색상 버튼
   ========================================================= */

$("selectionToolbar")
  .querySelectorAll("button")
  .forEach(
    btn => {

      btn.addEventListener(
        "mousedown",
        (e) => {

          e.preventDefault();


          const color =
            btn.dataset.textColor;


          document.execCommand(
            "foreColor",
            false,
            color
          );


          const sel =
            window.getSelection();


          if (
            sel.rangeCount > 0
          ) {

            let node =
              sel
                .getRangeAt(0)
                .commonAncestorContainer;


            while (
              node &&
              !node.classList
                ?.contains("memo")
            ) {

              node =
                node.parentNode;

            }


            if (node) {

              node.dispatchEvent(
                new Event(
                  "input",
                  {
                    bubbles: true
                  }
                )
              );

            }

          }

        }
      );

    }
  );


/* =========================================================
   날짜 설정
   ========================================================= */

function openToolbar(
  dateStr
) {

  selectedDate =
    dateStr;


  $("toolbarTitle")
    .textContent =
      `${dateStr} 설정`;


  $("toolbar")
    .classList
    .add("show");

}


$("closeToolbar")
  .addEventListener(
    "click",
    () => {

      $("toolbar")
        .classList
        .remove("show");

    }
  );


$("toolbar")
  .querySelectorAll(
    ".toolbar-grid button"
  )
  .forEach(
    btn => {

      btn.addEventListener(
        "click",
        () => {

          if (
            !selectedDate
          ) {

            return;

          }


          const status =
            btn.dataset.status;


          PARTS.forEach(
            part => {

              const entry =
                getEntry(
                  selectedDate,
                  part,
                  false
                );


              entry.status =
                status;


              queueSave(
                selectedDate,
                part
              );

            }
          );


          $("toolbar")
            .classList
            .remove("show");


          render();

        }
      );

    }
  );


/* =========================================================
   날짜 선택
   ========================================================= */

function selectDay(
  dayBox
) {

  document
    .querySelectorAll(
      ".day.selected-outline"
    )
    .forEach(
      el => {

        el.classList.remove(
          "selected-outline"
        );

      }
    );


  dayBox.classList.add(
    "selected-outline"
  );

}


/* =========================================================
   이전 달
   ========================================================= */

$("prevBtn")
  .addEventListener(
    "click",
    () => {

      viewDate.setMonth(
        viewDate.getMonth() - 1
      );


      loadMonth();

    }
  );


/* =========================================================
   다음 달
   ========================================================= */

$("nextBtn")
  .addEventListener(
    "click",
    () => {

      viewDate.setMonth(
        viewDate.getMonth() + 1
      );


      loadMonth();

    }
  );


/* =========================================================
   오늘
   ========================================================= */

$("todayBtn")
  .addEventListener(
    "click",
    () => {

      viewDate =
        new Date();


      viewDate.setDate(
        1
      );


      loadMonth();

    }
  );


/* =========================================================
   인쇄
   ========================================================= */

$("printBtn")
  .addEventListener(
    "click",
    () => {

      window.print();

    }
  );


/* =========================================================
   페이지 시작
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    loadMonth();

  }
);

</script>

</body>
</html>
