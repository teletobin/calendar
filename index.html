<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실장/코디/간호/피부 공유캘린더</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap");
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
    background: #f6f7f9;
    color: #222;
  }
  .top {
    background: #f7aeb2;
    padding: 10px 18px 6px;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .title-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
  }
  h1 { margin:0; font-size:22px; font-weight:800; letter-spacing:-0.7px; }
  .month-nav { display:flex; align-items:center; gap:8px; }
  button {
    border:0;
    border-radius:8px;
    background:#fff;
    cursor:pointer;
    padding:9px 13px;
    font-weight:700;
  }
  button:hover { filter:brightness(.97); }
  .month-label { min-width:125px; text-align:center; font-size:18px; font-weight:800; }
  .week-head {
    margin-top:6px;
    min-width:1580px;
    display:grid;
    grid-template-columns:82px repeat(6,minmax(235px,1fr));
    gap:8px;
    overflow-x:auto;
  }
  .week-head div {
    background:#fff4f4;
    text-align:center;
    padding:3px;
    font-weight:800;
    font-size:12px;
    border:1px solid rgba(0,0,0,.08);
  }
  .calendar-wrap {
    overflow-x:auto;
    padding:5px 18px;
  }
  .calendar {
    min-width:1580px;
    display:grid;
    grid-template-columns:82px repeat(6,minmax(235px,1fr));
    gap:8px;
  }
  .day {
    min-height:175px;
    background:#fff;
    border:1px solid #bfc3c8;
    position:relative;
    display:flex;
    flex-direction:column;
    transition:.12s;
  }
  .day.blank { background:#f0f1f2; }
  .day.sunday { background:#fff8f8; }
  .day.outside-month { opacity:.92; }
  .day-header {
    height:24px;
    flex:0 0 24px;
    padding:3px 6px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #c8c8c8;
    background:rgba(255,255,255,.72);
  }
  .date {
    font-weight:800;
    margin-left:auto;
    text-align:right;
  }
  .status-badge {
    font-size:9px;
    padding:1px 5px;
    border-radius:99px;
    background:#eee;
  }
  .status-badge.off { background:#333; color:#fff; }
  .status-badge.short { background:#ffe7a3; }
  .rows { flex:1; display:flex; flex-direction:column; }
  .part-row {
    flex:1 1 0;
    min-height:0;
    height:36px;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:stretch;
  }
  .part-name {
    width:42px;
    flex:0 0 42px;
    padding:2px 3px;
    font-weight:800;
    font-size:10px;
    border-right:1px solid #e0e0e0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .memo {
    width:100%;
    min-height:0;
    height:36px;
    border:0;
    outline:0;
    background:transparent;
    padding:2px 4px;
    font-size:11px;
    line-height:1.2;
    font-family:inherit;
    white-space:pre-wrap;
    overflow-y:hidden;
    overflow-wrap:anywhere;
    cursor:text;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    text-align:left;
  }
  .memo:focus { background:rgba(255,255,255,.55); }
  .memo:empty:before {
    content:attr(data-placeholder);
    color:#aaa;
  }
  .memo br { line-height:1.1; }
  .selection-toolbar {
    position:fixed;
    display:none;
    z-index:100;
    background:#fff;
    border:1px solid #bbb;
    border-radius:8px;
    box-shadow:0 5px 18px rgba(0,0,0,.2);
    padding:4px;
    gap:3px;
  }
  .selection-toolbar.show { display:flex; }
  .selection-toolbar button {
    width:26px;
    height:26px;
    padding:0;
    border:1px solid #ddd;
    background:#fff;
    border-radius:5px;
    font-size:18px;
    line-height:20px;
  }
  .selection-toolbar button:first-child { color:#222; }
  .selection-toolbar button.red { color:#d62828; }
  .selection-toolbar button.blue { color:#2468d8; }
  .empty { visibility:hidden; }
  .toolbar {
    position:fixed;
    right:18px;
    bottom:18px;
    width:330px;
    max-width:calc(100vw - 36px);
    background:#fff;
    border:1px solid #ccc;
    border-radius:14px;
    box-shadow:0 8px 28px rgba(0,0,0,.18);
    padding:14px;
    z-index:50;
    display:none;
  }
  .toolbar.show { display:block; }
  .toolbar h3 { margin:0 0 10px; }
  .toolbar-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .toolbar button { border:1px solid #ddd; padding:7px 4px; font-size:12px; }
  .selected-outline { outline:3px solid #4d7cff; outline-offset:-3px; }
  .save-state {
    position:fixed; left:18px; bottom:18px;
    background:#222; color:#fff; padding:8px 12px;
    border-radius:99px; font-size:12px; z-index:60;
  }
  .setup {
    margin:10px 10px 0;
    padding:10px 12px;
    border-radius:10px;
    background:#fff4d7;
    border:1px solid #ecd58c;
    font-size:10px;
  }
  .setup strong { color:#a05d00; }


  .signature {
    width:100%;
    text-align:center;
    color:#999;
    font-size:9px;
    letter-spacing:.4px;
    padding:8px 0 12px;
    user-select:none;
  }

  @media print {
    @page {
      size: A4 landscape;
      margin: 3mm;
    }
    html, body {
      width:100%;
      height:100%;
      margin:0;
      padding:0;
      background:#fff;
      overflow:visible;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
    .top {
      position:static;
      width:100%;
      padding:1mm 0 .5mm;
      box-shadow:none;
    }
    h1 { font-size:14pt; }
    .month-nav { display:none; }
    .week-head {
      margin:0;
      min-width:0;
      width:100%;
      display:grid;
      grid-template-columns:11mm repeat(6,minmax(0,1fr));
      gap:0.4mm;
      overflow:visible;
    }
    .week-head div {
      font-size:6.5pt;
      padding:.7mm;
    }
    .calendar-wrap {
      width:100%;
      padding:.7mm 0 0;
      overflow:visible;
    }
    .calendar {
      width:100%;
      min-width:0;
      height:174mm;
      display:grid;
      grid-template-columns:11mm repeat(6,minmax(0,1fr));
      grid-auto-rows:1fr;
      gap:0.4mm;
    }
    .day {
      min-height:0;
      height:100%;
      width:100%;
      border:0.25mm solid #777;
      break-inside:avoid;
    }
    .day-header {
      height:5mm;
      flex:0 0 5mm;
      padding:.4mm 1mm;
    }
    .date { font-size:6.5pt; margin-left:auto; text-align:right; }
    .status-badge { font-size:5pt; padding:.15mm .8mm; }
    .part-row {
      min-height:0;
      height:6.8mm;
      display:flex;
      align-items:stretch;
    }
    .part-name {
      width:7mm;
      flex-basis:7mm;
      padding:.35mm .25mm;
      font-size:5.5pt;
      align-items:center;
      justify-content:center;
      text-align:center;
    }
    .memo {
      min-height:0;
      height:6.8mm;
      padding:.3mm .6mm;
      font-size:5.8pt;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      text-align:left;
    }
    .setup, .toolbar, .selection-toolbar, .save-state {
      display:none !important;
    }
    .signature {
      font-size:5.5pt;
      padding:.8mm 0 0;
    }
    .calendar-wrap,
    .calendar,
    .week-head {
      max-width:100%;
    }
  }

  @media (max-width:700px) {
    h1 { font-size:18px; }
    .top { padding:8px; }
    .calendar-wrap { padding:6px; }
    .calendar { min-width:1550px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="title-row">
    <h1>실장/코디/간호/피부 공유캘린더</h1>
    <div class="month-nav">
      <button id="prevBtn">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="nextBtn">›</button>
      <button id="todayBtn">오늘</button>
      <button id="printBtn" type="button">인쇄</button>
    </div>
  </div>
  <div class="week-head">
    <div>일요일</div><div>월요일</div><div>화요일</div><div>수요일</div>
    <div>목요일</div><div>금요일</div><div>토요일</div>
  </div>
</header>

<div class="setup" id="setupNotice">
  <strong>처음 한 번만 설정:</strong> 아래 코드의 SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY를 본인 Supabase 프로젝트 값으로 바꾸고,
  함께 제공한 <b>supabase_setup.sql</b>을 Supabase SQL Editor에서 실행하세요.
</div>

<div class="calendar-wrap">
  <div class="calendar" id="calendar"></div>
</div>

<div class="signature">DESIGN &amp; DEVELOPMENT · EUNBIN GA</div>

<div class="toolbar" id="toolbar">
  <h3 id="toolbarTitle">날짜 설정</h3>
  <div class="toolbar-grid">
    <button data-status="normal">정상</button>
    <button data-status="off">휴무</button>
    <button data-status="short">단축근무</button>
  </div>
  <div style="margin-top:9px;font-size:11px;color:#666;">
    휴무 = 회색 / 단축근무 = 연노랑
  </div>
  <button id="closeToolbar" style="width:100%;margin-top:10px;">닫기</button>
</div>

<div class="selection-toolbar" id="selectionToolbar">
  <button type="button" data-text-color="#222222" title="진한 차콜">●</button>
  <button type="button" data-text-color="#d62828" title="빨간색" class="red">●</button>
  <button type="button" data-text-color="#2468d8" title="파란색" class="blue">●</button>
</div>

<div class="save-state" id="saveState">저장 준비 중…</div>

<script>
/* =========================================================
   1) Supabase 설정
   Supabase Dashboard > Settings > API Keys에서 확인
   브라우저에는 publishable/anon 키만 사용하세요.
   service_role 키는 절대 넣지 마세요.
========================================================= */
const SUPABASE_URL = "https://gysriyggwkdjriokttpt.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_a1qvwo_vSi0ftx1SVY_Ing_H8eIstT3";

const supabaseReady =
  !SUPABASE_URL.includes("YOUR-PROJECT") &&
  !SUPABASE_PUBLISHABLE_KEY.includes("YOUR-PUBLISHABLE-KEY");

const db = supabaseReady
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
  : null;

const PARTS = ["실장", "코디", "간호", "피부"];
const DEFAULT_SUNDAY = ["마감", "수건", "탕비실", "인스타"];

// 2026-08-02(일)을 기준으로 일요일 담당을 매주 자동 순환
// 탕비실: 간호 → 코디 → 피부
// 수건:   피부 → 코디
// 인스타: 피부 → 코디 → 간호
const SUNDAY_ROTATION_START = new Date(2026, 7, 2);

function getSundayDefaults(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const diffDays = Math.floor((d - SUNDAY_ROTATION_START) / 86400000);
  const weekIndex = Math.floor(diffDays / 7);

  const pantry = ["간호", "코디", "피부"][((weekIndex % 3) + 3) % 3];
  const towel = ["피부", "코디"][((weekIndex % 2) + 2) % 2];
  const instagram = ["피부", "코디", "간호"][((weekIndex % 3) + 3) % 3];

  return ["", towel, pantry, instagram];
}

let viewDate = new Date();
viewDate.setDate(1);
let entries = {};
let selectedDate = null;
let savingTimer = null;

const $ = id => document.getElementById(id);

function keyFor(dateStr, part) {
  return `${dateStr}__${part}`;
}

function dateToISO(date) {
  return [
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,"0"),
    String(date.getDate()).padStart(2,"0")
  ].join("-");
}

function setSaveState(text) {
  $("saveState").textContent = text;
}

async function loadMonth() {
  entries = {};
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth() + 1;
  const from = `${year}-${String(month).padStart(2,"0")}-01`;
  const last = new Date(year, month, 0).getDate();
  const to = `${year}-${String(month).padStart(2,"0")}-${last}`;

  if (!db) {
    setSaveState("미연결 데모 모드");
    render();
    return;
  }

  setSaveState("불러오는 중…");
  const { data, error } = await db
    .from("calendar_entries")
    .select("*")
    .gte("work_date", from)
    .lte("work_date", to);

  if (error) {
    console.error(error);
    setSaveState("DB 불러오기 오류");
    render();
    return;
  }

  for (const row of data || []) {
    entries[keyFor(row.work_date, row.part)] = {
      memo: row.memo || "",
      bg: row.bg_color || "",
      text: row.text_color || "",
      status: row.status || "normal"
    };
  }

  setSaveState("자동 저장됨");
  render();
}

function getEntry(dateStr, part, isSunday) {
  const key = keyFor(dateStr, part);
  if (!entries[key]) {
    const sundayDefaults = isSunday ? getSundayDefaults(dateStr) : ["", "", "", ""];
    entries[key] = {
      memo: isSunday ? sundayDefaults[PARTS.indexOf(part)] : "",
      bg: "",
      text: "",
      status: "normal"
    };
  }
  return entries[key];
}

function getDayStyle(dateStr) {
  const first = getEntry(dateStr, "실장", false);
  let bg = "";
  if (first.status === "off") bg = "#d9d9d9";
  if (first.status === "short") bg = "#fff3c4";
  return { bg };
}

function dayStatus(dateStr) {
  const first = getEntry(dateStr, "실장", false);
  return first.status || "normal";
}

function createDayBox(d, isOutsideMonth = false) {
  const year = d.getFullYear();
  const month = d.getMonth() + 1;
  const day = d.getDate();
  const dateStr = dateToISO(d);
  const sunday = d.getDay() === 0;

  const dayBox = document.createElement("div");
  dayBox.className = "day" + (sunday ? " sunday" : "");
  if (isOutsideMonth) dayBox.classList.add("outside-month");
  dayBox.dataset.date = dateStr;

  const style = getDayStyle(dateStr);
  if (style.bg) dayBox.style.background = style.bg;

  const header = document.createElement("div");
  header.className = "day-header";

  const dateEl = document.createElement("span");
  dateEl.className = "date";
  dateEl.textContent = `${month}/${day}`;

  const badge = document.createElement("span");
  badge.className = "status-badge";
  const status = dayStatus(dateStr);
  if (status === "off") { badge.textContent = "휴무"; badge.classList.add("off"); }
  else if (status === "short") { badge.textContent = "단축근무"; badge.classList.add("short"); }
  else if (status === "other") { badge.textContent = "기타"; }
  else { badge.textContent = ""; badge.style.display = "none"; }

  header.append(dateEl, badge);
  header.addEventListener("dblclick", () => openToolbar(dateStr));
  dayBox.appendChild(header);

  const rows = document.createElement("div");
  rows.className = "rows";

  PARTS.forEach((part, idx) => {
    const row = document.createElement("div");
    row.className = "part-row";

    const partName = document.createElement("div");
    partName.className = "part-name";
    partName.textContent = sunday ? DEFAULT_SUNDAY[idx] : part;

    const memo = document.createElement("div");
    memo.className = "memo";
    memo.contentEditable = "true";
    memo.spellcheck = false;

    const entry = getEntry(dateStr, part, sunday);
    const sundayDefault = sunday ? getSundayDefaults(dateStr)[idx] : "";
    memo.innerHTML = (sunday && !entry.memo) ? sundayDefault : entry.memo;
    memo.dataset.placeholder = sunday ? "" : ` `;

    memo.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;

      e.preventDefault();

      // 이미 2줄이면 더 이상 줄을 만들지 않음.
      const currentLines = memo.innerText.replace(/\\r/g, "").split("\\n");
      if (currentLines.length >= 2) return;

      const sel = window.getSelection();
      if (!sel || !sel.rangeCount) return;

      const range = sel.getRangeAt(0);
      if (!memo.contains(range.startContainer)) return;

      // 같은 포지션의 메모 안에서만 줄바꿈.
      const br = document.createElement("br");
      range.deleteContents();
      range.insertNode(br);
      range.setStartAfter(br);
      range.collapse(true);

      sel.removeAllRanges();
      sel.addRange(range);

      getEntry(dateStr, part, sunday).memo = memo.innerHTML;
      queueSave(dateStr, part);
    });

    memo.addEventListener("input", () => {
      getEntry(dateStr, part, sunday).memo = memo.innerHTML;
      queueSave(dateStr, part);
    });
    memo.addEventListener("mouseup", () => showSelectionToolbar(memo));
    memo.addEventListener("keyup", () => showSelectionToolbar(memo));

    row.append(partName, memo);
    rows.appendChild(row);
  });

  dayBox.appendChild(rows);

  dayBox.addEventListener("click", (e) => {
    if (e.target.closest("textarea")) return;
    selectDay(dayBox);
  });
  dayBox.addEventListener("dblclick", (e) => {
    if (e.target.closest("textarea")) return;
    openToolbar(dateStr);
  });

  return dayBox;
}

function render() {
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth() + 1;
  $("monthLabel").textContent = `${year}년 ${month}월`;

  const calendar = $("calendar");
  calendar.innerHTML = "";

  const firstDay = new Date(year, month-1, 1).getDay();
  const days = new Date(year, month, 0).getDate();

  // 첫 주의 일요일은 월이 시작되기 전의 실제 일요일을 표시한다.
  // 따라서 1일이 화요일이어도 첫 번째 일요일 칸이 비어 있지 않는다.
  if (firstDay > 0) {
    const previousSunday = new Date(year, month - 1, 1 - firstDay);
    calendar.appendChild(createDayBox(previousSunday, true));

    for (let i = 1; i < firstDay; i++) {
      const blank = document.createElement("div");
      blank.className = "day blank";
      calendar.appendChild(blank);
    }
  }

  for (let day=1; day<=days; day++) {
    const d = new Date(year, month-1, day);
    calendar.appendChild(createDayBox(d, false));
  }
}

function selectDay(el) {
  document.querySelectorAll(".selected-outline").forEach(x => x.classList.remove("selected-outline"));
  el.classList.add("selected-outline");
  selectedDate = el.dataset.date;
}

function openToolbar(dateStr) {
  selectedDate = dateStr;
  document.querySelectorAll(".selected-outline").forEach(x => x.classList.remove("selected-outline"));
  document.querySelector(`[data-date="${dateStr}"]`)?.classList.add("selected-outline");
  $("toolbarTitle").textContent = `${dateStr} 설정`;
  $("toolbar").classList.add("show");
}

function updateDayVisual(dateStr) {
  const first = getEntry(dateStr, "실장", false);
  const dayBox = document.querySelector(`[data-date="${dateStr}"]`);
  if (!dayBox) return;

  const style = getDayStyle(dateStr);
  dayBox.style.background = style.bg || "";

  const badge = dayBox.querySelector(".status-badge");
  badge.className = "status-badge";
  if (first.status === "off") {
    badge.textContent = "휴무"; badge.classList.add("off"); badge.style.display = "";
  } else if (first.status === "short") {
    badge.textContent = "단축근무"; badge.classList.add("short"); badge.style.display = "";
  } else {
    badge.textContent = ""; badge.style.display = "none";
  }
}

async function saveEntry(dateStr, part) {
  const e = getEntry(dateStr, part, new Date(dateStr).getDay() === 0);

  if (!db) {
    localStorage.setItem("clinicCalendarDemo", JSON.stringify(entries));
    setSaveState("자동 저장됨");
    return;
  }

  const row = {
    work_date: dateStr,
    part,
    memo: e.memo,
    status: getEntry(dateStr, "실장", false).status || "normal"
  };

  const { error } = await db
    .from("calendar_entries")
    .upsert(row, { onConflict: "work_date,part" });

  if (error) {
    console.error(error);
    setSaveState("저장 오류");
  } else {
    setSaveState("자동 저장됨");
  }
}

function queueSave(dateStr, part) {
  setSaveState("자동 저장 중…");
  clearTimeout(savingTimer);
  savingTimer = setTimeout(() => saveEntry(dateStr, part), 350);
}

async function saveWholeDay(dateStr) {
  for (const part of PARTS) await saveEntry(dateStr, part);
}

$("prevBtn").addEventListener("click", () => {
  viewDate.setMonth(viewDate.getMonth()-1);
  $("toolbar").classList.remove("show");
  loadMonth();
});
$("nextBtn").addEventListener("click", () => {
  viewDate.setMonth(viewDate.getMonth()+1);
  $("toolbar").classList.remove("show");
  loadMonth();
});
$("todayBtn").addEventListener("click", () => {
  viewDate = new Date();
  viewDate.setDate(1);
  $("toolbar").classList.remove("show");
  loadMonth();
});

$("printBtn").addEventListener("click", () => {
  $("toolbar").classList.remove("show");
  $("selectionToolbar").classList.remove("show");
  window.print();
});

document.querySelectorAll("[data-status]").forEach(btn => {
  btn.addEventListener("click", async () => {
    if (!selectedDate) return;
    const status = btn.dataset.status;
    PARTS.forEach(part => {
      getEntry(selectedDate, part, new Date(selectedDate).getDay() === 0).status = status;
    });
    updateDayVisual(selectedDate);
    await saveWholeDay(selectedDate);
  });
});

$("closeToolbar").addEventListener("click", () => $("toolbar").classList.remove("show"));


function showSelectionToolbar(editor) {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
    $("selectionToolbar").classList.remove("show");
    return;
  }
  if (!editor.contains(sel.anchorNode) || !editor.contains(sel.focusNode)) return;

  const rect = sel.getRangeAt(0).getBoundingClientRect();
  if (!rect.width && !rect.height) return;

  const bar = $("selectionToolbar");
  bar.classList.add("show");

  const barWidth = 100;
  let left = rect.left + rect.width / 2 - barWidth / 2;
  left = Math.max(5, Math.min(left, window.innerWidth - barWidth - 5));
  let top = rect.top - 38;
  if (top < 5) top = rect.bottom + 5;

  bar.style.left = `${left}px`;
  bar.style.top = `${top}px`;
}

document.querySelectorAll("#selectionToolbar button").forEach(btn => {
  btn.addEventListener("mousedown", e => e.preventDefault());
  btn.addEventListener("click", () => {
    const color = btn.dataset.textColor;
    document.execCommand("foreColor", false, color);

    const sel = window.getSelection();
    const editor = sel && sel.anchorNode
      ? sel.anchorNode.parentElement?.closest(".memo")
      : null;

    if (editor) {
      const dateStr = editor.closest(".day")?.dataset.date;
      const part = editor.closest(".part-row")?.querySelector(".part-name")?.textContent;
      if (dateStr && part) {
        getEntry(dateStr, part, new Date(dateStr).getDay() === 0).memo = editor.innerHTML;
        queueSave(dateStr, part);
      }
    }

    $("selectionToolbar").classList.remove("show");
    if (sel) sel.removeAllRanges();
  });
});

document.addEventListener("mousedown", e => {
  if (!e.target.closest(".selection-toolbar") && !e.target.closest(".memo")) {
    $("selectionToolbar").classList.remove("show");
  }
});

/* 데모 모드에서는 브라우저 localStorage에도 저장 */
if (!db) {
  try {
    const saved = JSON.parse(localStorage.getItem("clinicCalendarDemo") || "null");
    if (saved) entries = saved;
  } catch(e) {}
}

loadMonth();
</script>
